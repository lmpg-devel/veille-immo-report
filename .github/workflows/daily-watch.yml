name: Daily real estate watch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-real-estate-watch-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate and publish daily watch
        shell: pwsh
        run: |
          ./scripts/run-daily-watch-ci.ps1 `
            -Branch "${{ github.event.repository.default_branch }}" `
            -MaxAttempts 2
